<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лаборатори 02 - Бүртгэлийн анкет</title>
</head>
<body>


  <header>
    <h1>Хэрэглэгчийн бүртгэлийн анкет</h1>
    <p>Мэдээллээ үнэн зөв бөглөнө үү.</p>
  </header>

  <main>
  
    <form action="#" method="POST">
      
\
      <div>
        <label for="fullname">Овог нэр:</label>
        <input 
          type="text" 
          id="fullname" 
          name="fullname" 
          required 
          placeholder="Доржийн Бат"
        >
      </div>

  
      <div>
        <label for="email">Имэйл хаяг:</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          placeholder="example@mail.com"
        >
      </div>


      <div>
        <label for="password">Нууц үг (Дор хаяж 8 тэмдэгт, үсэг ба тоо):</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          pattern="(?=.*\d)(?=.*[a-zA-Z]).{8,}"
          title="Нууц үг нь хамгийн багадаа 8 тэмдэгттэй, үсэг болон тоо агуулсан байх ёстой"
        >
      </div>


      <div>
        <label for="dob">Төрсөн огноо:</label>
        <input 
          type="date" 
          id="dob" 
          name="dob" 
          required
        >
      </div>

      <fieldset>
        <legend>Хүйс:</legend>
        
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Эрэгтэй</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Эмэгтэй</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Бусад</label>
      </fieldset>

   
      <fieldset>
        <legend>Сонирхол (Олон сонголт хийж болно):</legend>
        
        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Спорт</label>

        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">Хөгжим</label>

        <input type="checkbox" id="tech" name="interests" value="tech">
        <label for="tech">Технологи</label>
      </fieldset>

      <div>
        <label for="education">Боловсролын түвшин:</label>
        <select id="education" name="education" required>
          <option value="">-- Сонгоно уу --</option>
          <option value="highschool">Бүрэн дунд</option>
          <option value="bachelor">Бакалавр</option>
          <option value="master">Магистр</option>
        </select>
      </div>

      <br>
      <button type="submit">Бүртгүүлэх</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Лабораторийн ажил 02. Бүх эрх хуулиар хамгаалагдсан.</p>
  </footer>

</body>
</html>
